<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wedding Invitation</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body { margin:0; font-family:'Playfair Display', serif; background:#fdf6f0; color:#333; }
    section { height:100vh; display:flex; justify-content:center; align-items:center; flex-direction:column; transition:opacity 1s; text-align:center; }
    h1 { font-family:'Great Vibes', cursive; font-size:3.5em; color:#b38b59; margin:0; }
    h2 { font-size:2em; margin:10px 0; }
    small { font-size:0.9em; color:#555; }
    button { padding:12px 24px; font-size:1.2em; border:none; background:#b38b59; color:white; cursor:pointer; border-radius:8px; margin-top:20px; }
    .hidden { opacity:0; pointer-events:none; }
    img.qr { margin-top:20px; width:150px; }
  </style>
</head>
<body>
  <!-- Hero Section -->
  <section id="hero">
    <h2>We are inviting you to the wedding of</h2>
    <h1>Kashfia Naaz</h1>
    <small>MCA</small>
    <h2>&</h2>
    <h1>Dr. Mohammed Abdul Baseer</h1>
    <small>M.B.B.S</small>
    <button onclick="showNext('venue')">View Venue</button>
  </section>

  <!-- Venue Section -->
  <section id="venue" class="hidden">
    <h2>Nikah Ceremony</h2>
    <p>After Isha at S.P.R Garden,<br>
       Attapur, Beside Indian Petrol Pump, Plot No.172</p>
    <p>We look forward to your presence!</p>
    <!-- QR Code for Google Maps -->
    <img class="qr" src="https://chart.googleapis.com/chart?chs=200x200&cht=qr&chl=https://maps.google.com/?q=S.P.R+Garden+Attapur+Hyderabad" alt="Map QR Code">
    <button onclick="showNext('rsvp')">RSVP</button>
  </section>

  <!-- RSVP Section -->
  <section id="rsvp" class="hidden">
    <h2>RSVP</h2>
    <p>Please confirm your presence</p>
    <button onclick="alert('Thank you for confirming!')">Confirm</button>
  </section>

  <script>
    function showNext(id) {
      document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }
  </script>
</body>
</html>
